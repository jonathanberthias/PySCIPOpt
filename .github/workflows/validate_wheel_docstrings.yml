name: Validate production wheel docstrings

on:
  push:
    branches: [ci/wheel-docstrings-production]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: windows-latest
            arch: AMD64



    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.0
        env:
          CIBW_BUILD: cp310-*
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BEFORE_TEST: "pip install -r {project}/requirements/test.txt"
          CIBW_TEST_COMMAND: >-
            python "{project}/scripts/check_wheel_docstrings.py" "{project}" &&
            pytest "{project}/tests"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os}}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
